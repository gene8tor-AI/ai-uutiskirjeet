<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<title>Plasma Tunnel — GLM-5.3 Flash Demo</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, cx, cy;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cx = W / 2; cy = H / 2;
}
window.addEventListener('resize', resize);
resize();

// Star particles flying through the tunnel
const stars = [];
for (let i = 0; i < 260; i++) {
  stars.push({
    a: Math.random() * Math.PI * 2,       // angle
    d: Math.random(),                      // normalized depth 0..1
    s: 0.4 + Math.random() * 1.6,          // speed
    hue: 180 + Math.random() * 140
  });
}

function plasmaColor(t, x, y) {
  // layered sine plasma
  const v =
    Math.sin(x * 0.013 + t * 1.3) +
    Math.sin(y * 0.011 - t * 0.9) +
    Math.sin((x + y) * 0.008 + t * 1.1) +
    Math.sin(Math.sqrt(x * x + y * y) * 0.012 - t * 1.7);
  return v / 4; // -1..1
}

let start = null;
function frame(ts) {
  if (start === null) start = ts;
  const t = (ts - start) / 1000;

  // background
  ctx.fillStyle = '#030308';
  ctx.fillRect(0, 0, W, H);

  // ---- Plasma backdrop (low-res, scaled up) ----
  const pw = 96, ph = 54;
  if (!frame.off) {
    frame.off = document.createElement('canvas');
    frame.off.width = pw; frame.off.height = ph;
  }
  const po = frame.off.getContext('2d');
  const img = po.createImageData(pw, ph);
  for (let y = 0; y < ph; y++) {
    for (let x = 0; x < pw; x++) {
      const v = plasmaColor(t, x * (W / pw), y * (H / ph));
      const idx = (y * pw + x) * 4;
      const h = 200 + v * 90;             // blue -> magenta range
      const l = 12 + (v + 1) * 14;
      const c = `hsl(${h}, 80%, ${l}%)`;
      // use fillRect fallback for speed
      po.fillStyle = c;
      po.fillRect(x, y, 1, 1);
    }
  }
  ctx.globalAlpha = 0.55;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(frame.off, 0, 0, W, H);
  ctx.globalAlpha = 1;

  // ---- Tunnel rings ----
  const rings = 22;
  const maxR = Math.hypot(cx, cy) * 1.2;
  for (let i = 0; i < rings; i++) {
    const p = ((i / rings) + t * 0.13) % 1;      // 0..1 depth
    const r = Math.pow(p, 2.4) * maxR;
    const alpha = p * 0.9;
    const hue = (t * 40 + p * 260 + i * 6) % 360;
    ctx.beginPath();
    // wobble: hexagonal distortion
    const wob = Math.sin(t * 1.5 + i * 0.7) * 0.08;
    for (let k = 0; k <= 64; k++) {
      const a = (k / 64) * Math.PI * 2;
      const rr = r * (1 + wob * Math.sin(a * 6 + t * 2));
      const x = cx + Math.cos(a) * rr;
      const y = cy + Math.sin(a) * rr * 0.92;
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = `hsla(${hue}, 95%, 60%, ${alpha})`;
    ctx.lineWidth = 1 + p * 3;
    ctx.stroke();
  }

  // ---- Stars / speed particles ----
  for (const s of stars) {
    s.d += s.s * 0.006;
    if (s.d > 1) { s.d = 0.02; s.a = Math.random() * Math.PI * 2; }
    const r = Math.pow(s.d, 2.2) * maxR;
    const x = cx + Math.cos(s.a + t * 0.05) * r;
    const y = cy + Math.sin(s.a + t * 0.05) * r * 0.92;
    const size = s.d * 3.2;
    ctx.fillStyle = `hsla(${s.hue}, 100%, ${60 + s.d * 25}%, ${0.3 + s.d * 0.7})`;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---- Center glow + title ----
  const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, 140);
  glow.addColorStop(0, `hsla(${(t * 60) % 360}, 100%, 75%, 0.85)`);
  glow.addColorStop(0.4, `hsla(${(t * 60 + 60) % 360}, 100%, 60%, 0.25)`);
  glow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(cx - 140, cy - 140, 280, 280);

  ctx.font = '600 26px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.fillText('PLASMA TUNNEL', cx, 48);
  ctx.font = '400 14px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fillText('GLM-5.3 Flash · Canvas Demo · Anna Korpi 🧭', cx, 72);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
